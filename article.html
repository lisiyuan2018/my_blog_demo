<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="代码拾遗 - 技术文章详情页">
  <title>文章详情 - 代码拾遗</title>
  <link rel="icon" href="assets/avatar.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="article">

  <!-- ===== 顶部导航栏 ===== -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">代码拾遗</a>
      <nav class="main-nav" aria-label="主导航">
        <a href="index.html" class="nav-link" data-nav="home">首页</a>
        <a href="index.html#articles" class="nav-link" data-nav="articles">文章</a>
        <a href="about.html" class="nav-link" data-nav="about">关于</a>
      </nav>
    </div>
  </header>

  <!-- ===== 主体内容区 ===== -->
  <main class="container">
    <div class="article-wrap">

      <!-- 文章详情（JS 根据 URL 参数 ?id= 渲染）：
           顶部：标题、作者、发布日期、分类标签
           正文：支持标题、段落、代码块、图片 -->
      <article class="article-detail" id="article-detail">
        <noscript>本页面需要启用 JavaScript 才能加载文章内容。</noscript>
      </article>

      <!-- 底部导航：上一篇 / 下一篇 -->
      <nav class="article-pager" id="article-pager" aria-label="上一篇下一篇导航"></nav>

    </div>
  </main>

  <!-- ===== 页脚：版权信息 / 建站时间 / 驱动标识 ===== -->
  <footer class="site-footer">
    <div class="container">
      <!-- 第一行：版权信息 -->
      <p class="footer-meta">
        <span>© 2026 代码拾遗</span>
        <span class="sep">·</span>
        <span>保留所有权利</span>
        <span class="sep">·</span>
        <span>由 <a href="about.html">李思远</a> 维护</span>
      </p>
      <!-- 第二行：建站时间 + 技术栈 + AI 驱动标识 -->
      <p class="footer-sub">
        <span>建于 2026 年 7 月</span>
        <span class="sep">·</span>
        <span>用 HTML / CSS / JavaScript 手工打造</span>
        <a class="footer-badge" href="https://claude.com/product/claude-code" target="_blank" rel="noopener" title="了解 Claude Code">
          <span class="badge-icon" aria-hidden="true">✦</span>由 Claude Code 驱动
        </a>
      </p>
    </div>
  </footer>

  <!-- 返回顶部按钮（滚动超过一屏时由 JS 显示） -->
  <button class="back-to-top" id="back-to-top" type="button" aria-label="返回顶部" title="返回顶部">↑</button>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
