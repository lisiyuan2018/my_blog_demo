<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="代码拾遗 - 李思远的个人技术博客，分享前端开发、JavaScript、工程化与 AI 的实践经验">
  <title>代码拾遗 - 个人技术博客</title>
  <link rel="icon" href="assets/avatar.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

  <!-- ===== 顶部导航栏 ===== -->
  <header class="site-header">
    <div class="container header-inner">
      <!-- 左侧：网站名称 / Logo -->
      <a href="index.html" class="logo">代码拾遗</a>
      <!-- 右侧：导航链接（当前页高亮由 main.js 控制） -->
      <nav class="main-nav" aria-label="主导航">
        <a href="index.html" class="nav-link" data-nav="home">首页</a>
        <a href="index.html#articles" class="nav-link" data-nav="articles">文章</a>
        <a href="about.html" class="nav-link" data-nav="about">关于</a>
      </nav>
    </div>
  </header>

  <!-- ===== 主体内容区：左文章列表 + 右侧边栏 ===== -->
  <main class="container main-layout">

    <!-- 左侧：文章列表（约 70% 宽度） -->
    <section class="article-list" id="articles" aria-label="文章列表">
      <!-- 分类筛选提示条（JS 渲染） -->
      <div id="filter-bar"></div>
      <!-- 文章卡片列表（JS 渲染） -->
      <div id="article-cards"></div>
    </section>

    <!-- 右侧：侧边栏（约 30% 宽度，移动端自动移至列表下方） -->
    <aside class="sidebar" aria-label="侧边栏">
      <!-- 个人信息卡片（JS 渲染） -->
      <div class="widget" id="widget-profile"></div>
      <!-- 文章分类列表 -->
      <div class="widget">
        <h3 class="widget-title">文章分类</h3>
        <ul class="category-list" id="category-list"></ul>
      </div>
      <!-- 最新文章列表 -->
      <div class="widget">
        <h3 class="widget-title">最新文章</h3>
        <ul class="recent-list" id="recent-list"></ul>
      </div>
    </aside>

  </main>

  <!-- ===== 页脚：版权信息 / 建站时间 / 驱动标识 ===== -->
  <footer class="site-footer">
    <div class="container">
      <!-- 第一行：版权信息 -->
      <p class="footer-meta">
        <span>© 2026 代码拾遗</span>
        <span class="sep">·</span>
        <span>保留所有权利</span>
        <span class="sep">·</span>
        <span>由 <a href="about.html">李思远</a> 维护</span>
      </p>
      <!-- 第二行：建站时间 + 技术栈 + AI 驱动标识 -->
      <p class="footer-sub">
        <span>建于 2026 年 7 月</span>
        <span class="sep">·</span>
        <span>用 HTML / CSS / JavaScript 手工打造</span>
        <a class="footer-badge" href="https://claude.com/product/claude-code" target="_blank" rel="noopener" title="了解 Claude Code">
          <span class="badge-icon" aria-hidden="true">✦</span>由 Claude Code 驱动
        </a>
      </p>
    </div>
  </footer>

  <!-- 返回顶部按钮（滚动超过一屏时由 JS 显示） -->
  <button class="back-to-top" id="back-to-top" type="button" aria-label="返回顶部" title="返回顶部">↑</button>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
